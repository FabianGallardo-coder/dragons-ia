# ══════════════════════════════════════════════
# Dragons & IA — Configuración de Render.com
# ══════════════════════════════════════════════

services:
  - type: web
    name: dragons-ia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dragons-ia-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEFAULT_AI_MODEL
        value: "claude-3-haiku-20240307"
      - key: PYTHON_VERSION
        value: "3.11.9"
    autoDeploy: true

databases:
  - name: dragons-ia-db
    plan: free
    databaseName: dragons_ia
    postgresMajorVersion: "16"
