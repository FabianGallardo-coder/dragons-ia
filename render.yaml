services:
  - type: web
    name: dragons-ia
    runtime: python
    repo: https://github.com/FrancoStino/dragons-ia
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dragons-ia-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: TTS_ENABLED
        value: "false"

databases:
  - name: dragons-ia-db
    region: oregon
    plan: free
    databaseName: dragons_ia
    ipAllowList:
      - name: "render-internal"
        cidr: "0.0.0.0/0"
        description: "Render internal access"
