<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Dragons & IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center font-serif">

    <div class="w-full max-w-md mx-auto px-4">
        <h1 class="text-3xl font-bold text-amber-400 text-center mb-8">⚔️ Iniciar Sesión</h1>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-300 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-100 focus:border-amber-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-gray-300 mb-1">Contraseña</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-100 focus:border-amber-500 focus:outline-none">
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden"></div>
            <div id="expired-msg" class="text-amber-400 text-sm hidden bg-amber-950 border border-amber-800 rounded p-3">
                ⏰ Tu sesión expiró. Iniciá sesión nuevamente.
            </div>

            <button type="submit"
                class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition text-lg">
                Entrar
            </button>
        </form>

        <p class="text-center text-gray-500 mt-4">
            ¿No tenés cuenta?
            <a href="/register.html" class="text-amber-400 hover:underline">Registrate</a>
        </p>

        <p class="text-center mt-2">
            <a href="/" class="text-gray-500 hover:text-gray-400 text-sm">← Volver al inicio</a>
        </p>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        // Mostrar aviso si vino de una sesión expirada
        if (new URLSearchParams(location.search).get('expired')) {
            document.getElementById('expired-msg').classList.remove('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await apiPost('/auth/login', { email, password });
                saveAuth(data.access_token, data.user);
                location.href = '/';
            } catch (err) {
                errorDiv.textContent = err.message || 'Error al iniciar sesión';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
