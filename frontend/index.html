<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons & IA</title>
    <script src="/static/js/tailwind.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center font-serif">

    <div id="app" class="w-full max-w-lg mx-auto px-4 text-center">
        <!-- Logo / Título -->
        <h1 class="text-5xl font-bold text-amber-400 mb-2 tracking-wider drop-shadow-lg">
            ⚔️ Dragons & IA
        </h1>
        <p class="text-gray-400 mb-10 text-lg italic">
            Tu aventura comienza aquí. La IA será tu Dungeon Master.
        </p>

        <!-- Botones para usuario NO autenticado -->
        <div id="guest-menu" class="space-y-4 hidden">
            <button onclick="location.href='/login.html'"
                class="w-full py-3 px-6 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition text-lg">
                Iniciar Sesión
            </button>
            <button onclick="location.href='/register.html'"
                class="w-full py-3 px-6 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg transition text-lg">
                Registrarse
            </button>
        </div>

        <!-- Botones para usuario autenticado -->
        <div id="user-menu" class="space-y-4 hidden">
            <p id="welcome-msg" class="text-amber-300 text-xl mb-4"></p>

            <button onclick="location.href='/config.html'"
                class="w-full py-3 px-6 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg transition text-lg">
                ⚙️ Configuración de IA
            </button>

            <button onclick="location.href='/world.html'"
                class="w-full py-3 px-6 bg-indigo-700 hover:bg-indigo-600 text-white font-bold rounded-lg transition text-lg">
                🌍 Nueva Aventura
            </button>

            <!-- Lista de partidas guardadas -->
            <div id="saves-section" class="hidden mt-4">
                <h3 class="text-gray-400 text-sm mb-2 text-left">📜 Tus partidas</h3>
                <div id="saves-list" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
            </div>

            <button id="btn-logout" onclick="logout()"
                class="w-full py-3 px-6 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg transition text-lg">
                Cerrar Sesión
            </button>
        </div>


    </div>

    <footer class="absolute bottom-4 text-gray-600 text-sm">
        Open Source | v0.1 Beta — Dragons & IA
    </footer>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUser();
            if (user) {
                document.getElementById('guest-menu').classList.add('hidden');
                document.getElementById('user-menu').classList.remove('hidden');
                document.getElementById('welcome-msg').textContent =
                    `Bienvenido, ${user.username}`;

                // Cargar lista de partidas
                try {
                    const saves = await apiGet('/game/saves');
                    if (saves.length > 0) {
                        const section = document.getElementById('saves-section');
                        section.classList.remove('hidden');
                        const list = document.getElementById('saves-list');

                        const WORLD_ICONS = {
                            fantasia: '🏰',
                            ciencia_ficcion: '🚀',
                            isekai: '🌀',
                            fantasia_oscura: '💀',
                        };

                        saves.forEach(save => {
                            const div = document.createElement('div');
                            div.className = 'flex items-center justify-between bg-gray-900 border border-gray-800 rounded-lg p-3 hover:border-gray-700 transition';

                            const worldIcon = WORLD_ICONS[save.character_world] || '🗡️';
                            const statusDot = save.is_active
                                ? '<span class="text-emerald-400 text-xs">● Activa</span>'
                                : '<span class="text-gray-600 text-xs">● Terminada</span>';

                            const date = new Date(save.updated_at).toLocaleDateString('es-AR', {
                                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                            });

                            // Info segura via textContent
                            const infoDiv = document.createElement('div');
                            infoDiv.className = 'text-left flex-1 min-w-0';

                            const titleRow = document.createElement('div');
                            titleRow.className = 'flex items-center gap-1';
                            const worldSpan = document.createElement('span');
                            worldSpan.textContent = worldIcon;
                            const titleP = document.createElement('p');
                            titleP.className = 'text-gray-200 text-sm font-medium truncate';
                            titleP.textContent = save.title;
                            titleRow.appendChild(worldSpan);
                            titleRow.appendChild(titleP);

                            const metaP = document.createElement('p');
                            metaP.className = 'text-gray-500 text-xs mt-0.5';
                            metaP.textContent = `Turno ${save.turn_count} — ${date}`;

                            infoDiv.appendChild(titleRow);
                            infoDiv.appendChild(metaP);
                            if (save.character_name) {
                                const charP = document.createElement('p');
                                charP.className = 'text-gray-600 text-xs';
                                charP.textContent = `✦ ${save.character_name}`;
                                infoDiv.appendChild(charP);
                            }

                            div.appendChild(infoDiv);

                            // Indicador estado
                            const statusSpan = document.createElement('span');
                            statusSpan.className = save.is_active ? 'text-emerald-400 text-xs mx-2' : 'text-gray-600 text-xs mx-2';
                            statusSpan.textContent = save.is_active ? '● Activa' : '● Fin';
                            div.appendChild(statusSpan);

                            // Botón jugar
                            if (save.is_active) {
                                const playBtn = document.createElement('button');
                                playBtn.className = 'bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded text-sm text-white ml-1 shrink-0';
                                playBtn.textContent = '▶ Jugar';
                                playBtn.onclick = () => resumeSave(save.id);
                                div.appendChild(playBtn);
                            }

                            // Botón eliminar
                            const delBtn = document.createElement('button');
                            delBtn.className = 'bg-gray-700 hover:bg-red-800 px-2 py-1 rounded text-xs text-gray-400 hover:text-white ml-1 shrink-0';
                            delBtn.title = 'Eliminar';
                            delBtn.textContent = '🗑️';
                            delBtn.onclick = () => deleteSave(save.id, div);
                            div.appendChild(delBtn);

                            list.appendChild(div);
                        });
                    }
                } catch (e) {
                    // Sin partidas, no mostrar
                }
            } else {
                document.getElementById('guest-menu').classList.remove('hidden');
                document.getElementById('user-menu').classList.add('hidden');
            }


        });

        function resumeSave(saveId) {
            localStorage.setItem('dia_active_save', saveId);
            location.href = '/game.html';
        }

        async function deleteSave(saveId, divEl) {
            if (!confirm('¿Eliminar esta partida? No se puede deshacer.')) return;
            try {
                await apiDelete(`/game/saves/${saveId}`);
                divEl.remove();
                // Si no quedan partidas, ocultar la sección
                const list = document.getElementById('saves-list');
                if (list && list.children.length === 0) {
                    document.getElementById('saves-section').classList.add('hidden');
                }
            } catch (e) {
                alert('Error al eliminar: ' + e.message);
            }
        }
    </script>
</body>
</html>
