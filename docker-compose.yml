services:
  postgres:
    image: postgres:16-alpine
    container_name: dragons-ia-postgres
    environment:
      POSTGRES_USER: dragons
      POSTGRES_PASSWORD: dragonspass
      POSTGRES_DB: dragons_ia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragons -d dragons_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dragons-ia-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dragons:dragonspass@postgres:5432/dragons_ia
      DEBUG: "true"
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      OLLAMA_API_BASE: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
