services:
  postgres:
    image: postgres:16-alpine
    container_name: dragons-ia-postgres
    environment:
      POSTGRES_USER: dragons
      POSTGRES_PASSWORD: dragonspass
      POSTGRES_DB: dragons_ia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragons -d dragons_ia"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  piper-tts:
    build:
      context: ./piper_server
    container_name: dragons-ia-piper
    platform: linux/amd64
    profiles:
      - tts
      - full
    volumes:
      - ./backend/piper_voices:/voices:ro
    environment:
      - TTS_VOICE=es_MX/claude/high/es_MX-claude-high
    restart: unless-stopped

  app:
    build: .
    container_name: dragons-ia-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dragons:dragonspass@postgres:5432/dragons_ia
      DEBUG: "true"
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      OLLAMA_API_BASE: http://host.docker.internal:11434
      TTS_ENABLED: "true"
      TTS_URL: http://piper-tts:5000
      TTS_VOICE: es_MX/claude/high/es_MX-claude-high
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend/piper_voices:/app/backend/piper_voices:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
