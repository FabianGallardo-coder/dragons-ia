version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dragons-ia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dragons_ia
      MYSQL_USER: dragons
      MYSQL_PASSWORD: dragonspass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  app:
    build: .
    container_name: dragons-ia-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://dragons:dragonspass@mysql:3306/dragons_ia
      JWT_SECRET_KEY: cambia-esto-por-un-secreto-largo-y-aleatorio-en-produccion
      DEBUG: "false"
      DEFAULT_AI_MODEL: claude-3-haiku-20240307
      OLLAMA_API_BASE: http://host.docker.internal:11434
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  mysql_data: